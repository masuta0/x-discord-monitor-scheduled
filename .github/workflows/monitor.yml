name: Monitor X search results

on:
  push:
    branches:
      - main
  schedule:
    # Every 15 minutes. Keep the schedule on the current workflow revision.
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-discord-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the latest state
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check X and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_SECONDARY: ${{ secrets.DISCORD_WEBHOOK_URL_SECONDARY }}
          SEARCH_QUERY: ${{ vars.SEARCH_QUERY || 'discord.gg/' }}
          SEARCH_PAGES: ${{ vars.SEARCH_PAGES || vars.SCROLL_ROUNDS || '10' }}
          MIN_MEMBER_COUNT: ${{ vars.MIN_MEMBER_COUNT || '10' }}
          MAX_MEMBER_COUNT: ${{ vars.MAX_MEMBER_COUNT || '1000' }}
          FOREIGN_SCORE_THRESHOLD: ${{ vars.FOREIGN_SCORE_THRESHOLD || '3' }}
          SPAM_TEXT_MIN_LENGTH: ${{ vars.SPAM_TEXT_MIN_LENGTH || '100' }}
          SPAM_ENGLISH_RATIO: ${{ vars.SPAM_ENGLISH_RATIO || '0.6' }}
          DISCORD_API_DELAY_MS: ${{ vars.DISCORD_API_DELAY_MS || '300' }}
        run: npm start

      - name: Persist duplicate-detection state
        run: |
          if git diff --quiet -- seen.json; then
            echo "No state changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: update seen post IDs [skip ci]"
          git push
